# Runs public-text's own tests (public-text/check.test.mjs) on every pull request and push to main
# that touches the check, with the same gitleaks that public-text.yml fetches. It holds no secret,
# and its token reads contents alone.
name: public-text-test

on:
  pull_request:
    paths:
      - 'public-text/**'
      - '.github/workflows/public-text*.yml'
  push:
    branches: [main]
    paths:
      - 'public-text/**'
      - '.github/workflows/public-text*.yml'
  workflow_dispatch:

concurrency:
  group: public-text-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same pin as public-text.yml's; a test holds the two the same.
      - name: fetch gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # CI is set on every runner, so a test that needs gitleaks fails rather than passing without it.
      - name: node --test
        run: |
          node --version
          GITLEAKS="$RUNNER_TEMP/gitleaks/gitleaks" node --test public-text/check.test.mjs
